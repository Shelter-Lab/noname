		// iOS PWA / 隐私模式下 localStorage、sessionStorage 可能为 null 或访问抛异常,
		// 而无名杀有上百处直接使用 localStorage(启动时 util/index.js 首行即调用)。
		// 此处在任何模块加载前做兜底:不可用则替换为内存实现,保证游戏不因存储缺失而崩溃。
		// 注意:内存版数据不跨会话持久化(刷新即失),但至少能正常游玩,不再报错白屏。

			"use strict";
			function makeMemoryStorage() {

				return {
					getItem: function (k) {
						k = String(k);
						return Object.prototype.hasOwnProperty.call(store, k) ? store[k] : null;
					},
					setItem: function (k, v) {
						store[String(k)] = String(v);
					},
					removeItem: function (k) {
						delete store[String(k)];
					},
					clear: function () {

					},
					key: function (i) {

					},
					get length() {
						return Object.keys(store).length;
					},
				};
			}

					var probe = "__noname_probe__";
					s.setItem(probe, "1");
					s.removeItem(probe);
					return true;
				} catch (e) {
					return false;
				}
			}
			["localStorage", "sessionStorage"].forEach(function (name) {
				if (!usable(name)) {

						Object.defineProperty(window, name, { value: makeMemoryStorage(), configurable: true });
					} catch (e) {
						// defineProperty 失败(极少数环境)时直接赋值兜底
						try {
							window[name] = makeMemoryStorage();
						} catch (e2) {}
					}

			});
		})();

			//  - 且 sessionStorage 若退化成内存实现(见本文件顶部兜底),getItem 恒为 null → 无限 reload。
		}
	</script>

				// 末尾(423 行)才加载 —— 任何模块链接错误发生时,自修复那块早已执行、函数已挂上 window。

	<script>
		// —— PWA 缓存自修复:治"启动报 importing binding name 'x' is not found"(行列号 0)——
		//
		// 【病】产物文件名不带 hash(index4.js 永远叫 index4.js),而 vite 的 _virtual chunk 编号会随
		// 依赖图漂移 —— 同一个 index4.js 上一版可能是别的模块、导出别的字母。一旦 Cache Storage 里
		// 攒下"一部分旧版 + 一部分新版"的代码文件,而 ES 模块图是整体链接的,新 cacheContext.js 向旧
		// index4.js 要 { c } 就拿不到 → link 阶段 SyntaxError(不属于任何一行,故行列号 0)→ 白屏。
		// 这种状态**不会自愈**:SW 若认为自己版本一致,压根不会去网络重取。
		//
		// 【为什么修复代码放在 index.html 里】它是唯一能在"模块图已经坏掉"时还确定能跑的地方:
		//  1. index.html 不参与 ES 模块图,新旧混搭对它无害 —— 而病根恰恰是模块图必须整版一致;
		//  2. 内联脚本不是 module,不受模块链接失败牵连(已实测:链接报错时内联脚本照常执行);

		//     总能在下一次启动到位,不需要用户做任何事。
		//
		// 【怎么绕开"正在喂你旧字节"的那个 SW】这是本方案唯一的死结:旧 SW 命中缓存就返回,压根不看

		// **必然未命中** → 旧 SW 只剩走网络一条路 → 拿到服务器上的真字节 → 再写回**干净 URL**覆盖旧的。

			var MARK = "__pwafixed";
			var CACHE = "noname-pwa-v2";

			var running = false;

			}

			function say(text) {

					tip.setAttribute("style", "position:fixed;left:0;top:0;right:0;bottom:0;z-index:2147483647;background:#000;color:#fff;display:flex;align-items:center;justify-content:center;text-align:center;padding:6vmin;font-size:4vmin;line-height:1.8;white-space:pre-wrap;");

				// 【防循环守卫用 hash,不用 sessionStorage】standalone 下 sessionStorage 可能退化成内存实现
				// (见本文件顶部兜底),那样"只修一次"的标记读出来恒为空 → 修完刷、刷完再修 → 无限循环。
				// hash 跟着 location.reload() 天然留存,且本项目没有任何代码使用 location.hash(已 grep 确认)。
				location.hash = MARK;
				location.reload();
			}

			// 手动入口:控制台里跑 __pwaRepair() 也能修(自动触发没赶上时的兜底)
			// 【防循环守卫下移到这里】上面那两个属性式处理器(onerror/onunhandledrejection,112 行起的块)
			// 也会调本函数,它们不经过 onMixed,故守卫不能只放在 onMixed 里,否则会 repair → reload →
			// 又报错 → 又 repair 无限循环。手动从控制台调时可传 true 强制执行(绕过守卫)。
			window.__pwaRepair = function (force) {
				if (!force && (alreadyTried || running)) return;
				return repair().catch(function (e) {
					hideTip();
					alert("缓存修复未完成:" + (e && e.message ? e.message : e) + "\n请确认联网后重新打开。");
				});
			};

			// 这一轮已经修过了(hash 上有标记):不再重修,把原始报错照常弹出来,免得掩盖真问题。
			var alreadyTried = location.hash.indexOf(MARK) !== -1;
			if (alreadyTried) {
				// 【标记必须立刻摘掉,不能等 20 秒】原来是撑过 20s 没再报错才摘,想的是"确认修好了再放行"。
				// 但真实故障下报错在启动瞬间就发生,用户看完弹窗就退出/重开,那 20 秒永远走不完 ——
				// 于是 __pwafixed 永久钉在 hash 上,自修复此后**一次都不会再触发**,变成死锁:
				// 修过一次(哪怕没修成)就再也修不了了。这正是"说好了有自修复却仍旧报同一个错"的原因。
				// 改成立刻摘:防循环的职责交给内存里的 alreadyTried —— 本次加载不再修(避免 repair →
				// reload → 又报错 → 又 repair 的无限循环),但用户下次主动打开时可以再试一次。
				// 于是最坏情况是"每次手动打开尝试修一次",而不是"永久放弃"。
				try {
					history.replaceState(null, "", location.pathname + location.search);
				} catch (e) {}
			}

			// 【触发点必须用 addEventListener,不能包 window.onerror】
			// noname 启动到一半会在 noname/util/error.ts 的 setOnError() 里把 window.onerror 和
			// window.onunhandledrejection **整个重新赋值**,属性式的包装会被直接冲掉。事件监听器不受
			// 赋值影响,且按注册顺序先跑(本文件在最前面注册,所以总是第一个拿到)。
			//   · 启动期模块图 link 失败:走 error 事件。那会儿 boot 一行都没跑到、setOnError 也没执行,
			//     两种写法都能接住 —— 这是"整台白屏"那类故障,主路径。
			//   · 启动成功后动态 import 的 chunk 混搭(sdp.js/sdp2.js/index4.js 等 6 个只在用到时才加载):
			//     失败形态是 **unhandledrejection**,而此时 error.ts 已接管属性处理器 ——
			//     只包 onerror 就永远收不到,那 6 个坏了只能手动跑 __pwaRepair()。故两种事件都监听。
			// stopImmediatePropagation:自修复已经接手并全屏显示进度了,别让 error.ts 再弹一个技术报错框
			// 盖在上面。不命中的错误一律不碰,原有 alert 照旧。
			function onMixed(e, msg) {
				if (alreadyTried || running || !looksMixed(msg)) return;
				if (typeof e.stopImmediatePropagation === "function") e.stopImmediatePropagation();
				if (typeof e.preventDefault === "function") e.preventDefault();
				window.__pwaRepair();
			}
			// 不带 capture:资源加载失败(图片/音频 404)不冒泡到 window,收不到 → 不会误触发重灌
			window.addEventListener("error", function (e) {
				onMixed(e, e && e.message);
			});
			window.addEventListener("unhandledrejection", function (e) {
				var r = e && e.reason;
				onMixed(e, r && r.message ? r.message : r);
			});
		})();
	</script>
	<script type="module" src="./noname/entry.ts"></script>
</head>
